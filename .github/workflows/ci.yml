name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, gd, sqlite3, pdo_sqlite, mbstring, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Sicherheits-Audit (Composer + npm)
        run: |
          composer audit
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Assets bauen
        run: npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
