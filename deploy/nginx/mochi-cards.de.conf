# Production — mochi-cards.de
# Pfad auf VM: /etc/nginx/sites-available/mochi-cards.de
#
# WICHTIG: Keine Certbot-`if ($host = …)` Redirects — die lenken www oft
# auf https://www statt Apex und sind redundant zum location-/Redirect.
#
# PHP-Socket prüfen: ls /run/php/php*-fpm.sock
# Dann: sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS Apex (beide Hostnames in einem Hop)
server {
    listen 80;
    listen [::]:80;
    server_name mochi-cards.de www.mochi-cards.de;

    root /var/www/mochi-cards/public;
    index index.php;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://mochi-cards.de$request_uri;
    }
}

# HTTPS www → Apex (eigener Block, damit HSTS auch auf dem Redirect ankommt)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mochi-cards.de;

    ssl_certificate     /etc/letsencrypt/live/mochi-cards.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mochi-cards.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://mochi-cards.de$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mochi-cards.de;

    root /var/www/mochi-cards/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/mochi-cards.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mochi-cards.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    client_max_body_size 32M;

    # --- Performance: Kompression + Datei-Handle-Cache ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/manifest+json image/svg+xml font/ttf;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_errors off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Socket an installierte PHP-Version anpassen (8.3, 8.4 oder 8.5): ls /run/php/
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Service Worker + Manifest: nie lange cachen, sonst kommen Updates nicht an.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri /index.php?$query_string;
    }

    # Uploads (Admin-Bilder): nie als PHP ausführen; SVG/HTML-Uploads in einer Sandbox
    # ausliefern, damit eingebettete Skripte nicht im Shop-Origin laufen (Stored XSS).
    location ^~ /storage/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        location ~ \.(php|phtml|phar)$ { deny all; }
        try_files $uri =404;
    }

    location ^~ /build/ {
        access_log off;
        expires 30d;
        # nginx: add_header in location überschreibt Parent-Header — HSTS bewusst wiederholen
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
