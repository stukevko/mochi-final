# Lokal oder auf jedem Server mit Docker:
#   cp .env.example .env && docker compose run --rm app php artisan key:generate --show
#   (Key in .env als APP_KEY eintragen), dann: docker compose up -d --build
# Shop: http://localhost:8080   Admin: http://localhost:8080/admin
# Admin anlegen: docker compose exec app php artisan shop:ensure-admin

x-app: &app
  build: .
  image: mochi-cards:latest
  env_file: .env
  environment:
    DB_CONNECTION: ${DB_CONNECTION:-sqlite}
    DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/data/database.sqlite}
  volumes:
    - storage:/var/www/html/storage/app
    - database:/var/www/html/database/data
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment:
      AUTORUN_ENABLED: "false"
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/data/database.sqlite}
    depends_on: [app]

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      AUTORUN_ENABLED: "false"
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/data/database.sqlite}
    depends_on: [app]

volumes:
  storage:
  database:
